services:
  postgres:
    image: postgres:16
    container_name: practice-comments-db
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - practice-comments-data:/var/lib/postgresql/data

volumes:
  practice-comments-data:
